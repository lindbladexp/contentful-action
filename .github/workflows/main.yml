name: Contentful Migration Example

on:
  workflow_dispatch:
    inputs:
      head_ref:
        description: "Branch to build the sandbox environment for. Defaults to the branch this workflow is dispatched from."
        required: false
        type: string

jobs:
  build:

    runs-on: [self-hosted, linux]
    name: Contentful Migration Example
    permissions:
      contents: read
    steps:
    # An empty ref means "the ref this run was dispatched from", so the
    # migrations and the action code always come from the branch being built.
    - name: Check out code into the directory
      uses: actions/checkout@v7
      with:
        ref: ${{ inputs.head_ref }}

    - name: Contentful Migration
      id: migrate
      uses: ./
      with:
        delete_feature: false
        set_alias: true
        master_pattern: "prod-[DD].[MM].[YYYY]-[hh][mm][ss]"
        feature_pattern: "sandbox-[branch]"
        version_field: version
        version_content_type: versionTracking
        migrations_dir: test-migrations
        head_ref: ${{ inputs.head_ref || github.ref_name }}
        space_id: ${{ secrets.SPACE_ID }}
        management_api_key: ${{ secrets.MANAGEMENT_API_KEY }}
      env:
        LOG_LEVEL: verbose

    - name: Report environment
      run: |
        echo "See changes to the [${{ steps.migrate.outputs.environment_name }}](${{ steps.migrate.outputs.environment_url }}) Environment on Contentful." >> "$GITHUB_STEP_SUMMARY"
